name: Deploy Tree Museum to GitHub Pages

on:
  push:
    branches: [codex/tree-museum-coordinator]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: museum-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'satoramoto/web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build:museum
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-museum
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
